name: Build Nova 1.0 for Linux

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nova
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Nova
        run: |
          pyinstaller \
            --onefile \
            --name nova \
            nova_1_0_0.py

      - name: Test Nova
        run: |
          ./dist/nova --version
          ./dist/nova help

      - name: Package Nova
        run: |
          mkdir nova-1.0.0-linux-x86_64
          cp dist/nova nova-1.0.0-linux-x86_64/
          tar -czf nova-1.0.0-linux-x86_64.tar.gz \
            nova-1.0.0-linux-x86_64

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: nova-1.0.0-linux-x86_64
          path: nova-1.0.0-linux-x86_64.tar.gz
